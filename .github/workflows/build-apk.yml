name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBudget-v1.4.0.apk

      - name: Update Repository About Description & Homepage
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"📱 Smart Daily Expense Tracker with In-App Auto-Updates, 1-Click Local Backup & Multi-Currency Manager", "homepage":"https://github.com/sachinmandawi/pocket-budget-app/releases/tag/v1.4.0"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release v1.4.0
        run: |
          cat << 'EOF' > release-notes.md
          ## ✨ What's New

          - **🌓 Theme Persistence**: Light and Dark mode are now permanently saved across app restarts.
          - **🎨 Refined UI**: Clean design refinements, compact billing cycle display, and responsive mobile layout.
          - **🧈 Smooth Animations**: 120fps fluid sidebar navigation and polished action buttons.

          ---
          ### 📦 Direct Android APK Download
          - **PocketBudget-v1.4.0.apk** (Attached below)
          EOF

          upload_release() {
            if gh release view v1.4.0 >/dev/null 2>&1; then
              echo "Release v1.4.0 exists. Updating assets and notes..."
              gh release edit v1.4.0 --title "Pocket Budget v1.4.0 — Refined UI & Theme Experience ✨🎨" --notes-file release-notes.md || true
              gh release upload v1.4.0 release-assets/PocketBudget-v1.4.0.apk --clobber
            else
              echo "Creating new release v1.4.0..."
              gh release create v1.4.0 release-assets/PocketBudget-v1.4.0.apk --title "Pocket Budget v1.4.0 — Refined UI & Theme Experience ✨🎨" --notes-file release-notes.md
            fi
          }

          for i in 1 2 3 4 5; do
            echo "Release attempt $i/5..."
            if upload_release; then
              echo "Successfully uploaded release v1.4.0!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
