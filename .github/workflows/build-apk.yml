name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBudget-v1.1.0.apk

      - name: Delete Old v1.1.0 Release if exists
        run: |
          gh release delete v1.1.0 --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Repository About Description & Homepage
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"📱 Smart, Self-Healing Daily Expense Tracker & Multi-Currency Allowance Manager with Piggy Bank Vault & Private Cloud Sync", "homepage":"https://github.com/sachinmandawi/pocket-budget-app/releases/tag/v1.1.0"}'

      - name: Upload APK to GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Pocket Budget v1.1.0 — Global Multi-Currency Release 🌍✨"
          body: |
            # 📱 Pocket Budget v1.1.0 — Global Multi-Currency Release 🚀

            Welcome to **Pocket Budget v1.1.0**, featuring full **Global Multi-Currency Support** (100+ world currencies including 🇵🇭 PHP, 🇮🇳 INR, 🇺🇸 USD, 🇪🇺 EUR, 🇬🇧 GBP, etc.), an eye-catching minimal currency selector, and hardened stability!

            ---

            ### 🌍 New in v1.1.0:

            - 💱 **100+ World Currencies**: Choose from over 100 country currencies with country search, instant switch, and live formatting across the entire app.
            - 🎨 **Minimal & Eye-Catching Currency Settings**: Ultra-sleek UI with search filter, country names, bold symbol badges, and 1-tap instant save.
            - 👛 **Spend Source Selection**: Choose whether an expense is deducted from your **Main Daily Allowance** or your **Piggy Bank Vault**.
            - 🐷 **Piggy Bank Vault (Lifetime Savings)**: Leftover daily allowance builds up in your Piggy Bank Vault indefinitely across months — save for big goals!
            - 🛡️ **Smart Insufficient Balance Alert**: Real-time balance validation prevents over-drawing with clear warnings when typing an amount.
            - ⏱️ **Allowance Countdown**: Dedicated digital clock countdown tracking days, hours, minutes, and seconds until your next payday credit.
            - 📱 **Ultra-Clean Left Sidebar**: 100% clutter-free navigation drawer with native Android status bar notch safe-area compatibility.
            - 🔄 **Native Hardware Back Navigation**: Smooth Android hardware back button support with double-back to exit.
            - 🔬 **Verified 10-Pass Deep Audit**: 44/44 automated assertions passed with 0 errors.

            ---

            ### ☁️ Private GitHub Cloud Sync Database (`pocket-budget-db`):

            - 🔒 **100% Private Data Ownership**: All transactions, piggy vault savings, and settings sync directly into your private GitHub repository (`pocket-budget-db`). No 3rd-party servers ever touch your financial data!
            - ⚡ **Multi-Device Real-Time Auto-Sync**: Seamlessly log spends and sync budget stats across multiple phones, tablets, or web browsers instantly.
            - 🔑 **1-Click Cloudflare OAuth Login**: Instant secure GitHub login integration without typing manual tokens!
          files: release-assets/PocketBudget-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
