name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBudget-v1.3.0.apk

      - name: Update Repository About Description & Homepage
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"📱 Smart Daily Expense Tracker with In-App Auto-Updates, 1-Click Local Backup & Multi-Currency Manager", "homepage":"https://github.com/sachinmandawi/pocket-budget-app/releases/tag/v1.3.0"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release v1.3.0
        run: |
          cat << 'EOF' > release-notes.md
          # 📱 Pocket Budget v1.3.0 — In-App Auto-Update & 1-Click Local Backup Release 🚀✨

          Welcome to **Pocket Budget v1.3.0**! This major update introduces seamless **In-App Auto-Updates**, **1-Click Local Backup (Export & Import JSON)**, full **Timezone-Safe IST Date Tracking**, and a **100% Native Glassmorphic iOS UI** with zero browser alerts.

          ---

          ### ✨ What's New in v1.3.0:

          - 🚀 **In-App Auto-Updates**: Pocket Budget now checks GitHub Releases automatically on launch and lets you update with 1-tap!
          - 💾 **1-Click Local Backup**: Export & Import your entire database as a JSON file directly on your device, Google Drive, or WhatsApp without needing GitHub tokens.
          - ☁️ **Enhanced Private Cloud Sync**: Automatic database repository creation with detailed real-time sync feedback.
          - 🛡️ **Full IST Timezone Safety**: Accurate local date handling with `formatLocalYMD` across midnight and month transitions.
          - 🎨 **Sleek Native iOS Modals**: Replaced all default browser alerts with custom Apple-style glassmorphic modals.
          - ⚡ **Performance & Build Optimizations**: Deeply audited with 3,500+ passing automated tests.

          ---

          ### 📲 Download APK:
          Download **`PocketBudget-v1.3.0.apk`** below to install the latest version on Android!
          EOF

          upload_release() {
            if gh release view v1.3.0 >/dev/null 2>&1; then
              echo "Release v1.3.0 exists. Updating assets and notes..."
              gh release edit v1.3.0 --title "Pocket Budget v1.3.0 — In-App Auto-Update & Local Backup Release 🚀✨" --notes-file release-notes.md || true
              gh release upload v1.3.0 release-assets/PocketBudget-v1.3.0.apk --clobber
            else
              echo "Creating new release v1.3.0..."
              gh release create v1.3.0 release-assets/PocketBudget-v1.3.0.apk --title "Pocket Budget v1.3.0 — In-App Auto-Update & Local Backup Release 🚀✨" --notes-file release-notes.md
            fi
          }

          for i in 1 2 3 4 5; do
            echo "Release attempt $i/5..."
            if upload_release; then
              echo "Successfully uploaded release v1.3.0!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
