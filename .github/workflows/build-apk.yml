name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBudget-v1.1.0.apk

      - name: Delete Old v1.1.0 Release if exists
        run: |
          gh release delete v1.1.0 --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Repository About Description & Homepage
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"📱 Smart, Self-Healing Daily Expense Tracker & Multi-Currency Allowance Manager with Piggy Bank Vault & Private Cloud Sync", "homepage":"https://github.com/sachinmandawi/pocket-budget-app/releases/tag/v1.1.0"}'

      - name: Upload APK to GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Pocket Budget v1.1.0 — Global Multi-Currency Release 🌍✨"
          body: |
            # 📱 Pocket Budget v1.1.0 — Global Multi-Currency Release 🌍🚀

            Welcome to **Pocket Budget v1.1.0**! This major update brings comprehensive **Global Multi-Country Currency Support**, allowing users worldwide to track their daily pocket expenses in their local currency.

            ---

            ### 🌍 What's New in v1.1.0:

            - 🌐 **100+ World Currencies**: Full native support for over 100 country currencies, including:
              - 🇵🇭 **PHP (₱)** — Philippine Peso
              - 🇮🇳 **INR (₹)** — Indian Rupee
              - 🇺🇸 **USD ($)** — US Dollar
              - 🇪🇺 **EUR (€)** — Euro
              - 🇬🇧 **GBP (£)** — British Pound
              - 🇦🇪 **AED** — UAE Dirham
              - 🇸🇦 **SAR** — Saudi Riyal
              - 🇧🇩 **BDT (৳)** — Bangladeshi Taka
              - 🇵🇰 **PKR (₨)** — Pakistani Rupee
              - 🇳🇵 **NPR (₨)** — Nepalese Rupee
              - 🇨🇦 **CAD ($)** — Canadian Dollar
              - 🇦🇺 **AUD ($)** — Australian Dollar
              - 🇯🇵 **JPY (¥)** — Japanese Yen
              - 🇸🇬 **SGD ($)** — Singapore Dollar
              - and 85+ more worldwide currencies!
            - 🔍 **Instant Country & Currency Search**: Quickly find your currency by typing country name, currency code, or symbol.
            - 🎨 **Minimal & Eye-Catching Currency Selector**: Ultra-clean, clutter-free settings interface with bold currency badges and 1-tap instant switch.
            - ⚡ **Dynamic App-Wide Formatting**: Daily limit, remaining in-hand, piggy bank vault, charts, and transaction history dynamically adapt to your selected currency symbol.

            ---

            ### ☁️ Private GitHub Cloud Sync (`pocket-budget-db`):

            - 🔒 **100% Private Data Ownership**: All transactions and multi-currency settings sync directly to your personal GitHub repository.
            - ⚡ **Real-Time Cross-Device Sync**: Seamlessly access and manage your finances across all your devices.
          files: release-assets/PocketBudget-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
