name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBudget-v1.0.1.apk

      - name: Update Repository About Description & Homepage
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"📱 Smart, Self-Healing Daily Expense Tracker & Allowance Manager with Piggy Bank Vault & Private Cloud Sync", "homepage":"https://github.com/sachinmandawi/pocket-budget-app/releases/tag/v1.0.1"}'

      - name: Upload APK to GitHub Release v1.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Pocket Budget v1.0.1 — Official Release 📱✨"
          body: |
            # 📱 Pocket Budget v1.0.1 — Official Release 🚀

            Welcome to **Pocket Budget v1.0.1**, your smart, self-healing daily expense tracker & allowance manager built with modern iOS glassmorphism design!

            ---

            ### ✨ Key Features & User Highlights:

            - 👛 **Spend Source Selection**: Choose whether an expense is deducted from your **Main Daily Allowance** or your **Piggy Bank Vault**.
            - 🐷 **Piggy Bank Vault (Lifetime Savings)**: Leftover daily allowance builds up in your Piggy Bank Vault indefinitely across months — save for big goals!
            - 🛡️ **Smart Insufficient Balance Alert**: Real-time balance validation prevents over-drawing with clear warnings when typing an amount.
            - ⏱️ **Allowance Countdown**: Dedicated digital clock countdown tracking days, hours, minutes, and seconds until your next payday credit.
            - 📱 **Ultra-Clean Left Sidebar**: 100% clutter-free navigation drawer with native Android status bar notch safe-area compatibility.
            - 🎛️ **Compact & Sleek Design**: Modern iOS typography, compact action buttons, dark mode support, and smooth micro-animations.
            - 🔄 **Native Hardware Back Navigation**: Smooth Android hardware back button support with double-back to exit.
            - 🔴 **iOS Glassmorphism Confirmation Modal**: Custom iOS confirmation modal for Data Reset to ₹0 state.

            ---

            ### ☁️ Private GitHub Cloud Sync Database (`pocket-budget-db`):

            - 🔒 **100% Private Data Ownership**: All transactions, piggy vault savings, and settings sync directly into your private GitHub repository (`pocket-budget-db`). No 3rd-party servers ever touch your financial data!
            - ⚡ **Multi-Device Real-Time Auto-Sync**: Seamlessly log spends and sync budget stats across multiple phones, tablets, or web browsers instantly.
            - 🔑 **1-Click Cloudflare OAuth Login**: Instant secure GitHub login integration without typing manual tokens!
          files: release-assets/PocketBudget-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
