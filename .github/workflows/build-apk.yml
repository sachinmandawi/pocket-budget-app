name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PocketBudget-v1.2.0.apk

      - name: Delete Old v1.2.0 Release if exists
        run: |
          gh release delete v1.2.0 --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Repository About Description & Homepage
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{"description":"📱 Smart, Self-Healing Daily Expense Tracker & Multi-Currency Allowance Manager with Custom Currency Creator & Private Cloud Sync", "homepage":"https://github.com/sachinmandawi/pocket-budget-app/releases/tag/v1.2.0"}'

      - name: Upload APK to GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Pocket Budget v1.2.0 — Custom Multi-Currency & New Piggy Vault Logo 🐷✨"
          body: |
            # 📱 Pocket Budget v1.2.0 — Custom Multi-Currency & New Piggy Vault Logo 🚀

            Welcome to **Pocket Budget v1.2.0**! This release brings powerful **Custom Currency Creation**, full support for **Cuban Peso (CUP)**, and a **brand-new modern Piggy Bank Vault app logo & splash screen** across Web & Android.

            ---

            ### ✨ What's New in v1.2.0:

            - 🛠️ **Custom Currency Creator**: Set any custom currency symbol (e.g. `$MN`, `CU$`, `₱`, `₿`, `zł`, `pts`), custom ISO code, custom country/wallet name, and custom emoji!
            - 🇨🇺 **Cuba (CUP) Currency Added**: Added native Cuban Peso support based on user feedback.
            - 🐷 **Brand New App Logo & Icons**: Fresh, modern iOS-style 3D Piggy Vault app icon across Web, PWA, Android Launcher icons, and Native Splash Screens.
            - ⚡ **Instant Currency Sync**: One-tap selection instantly updates the daily gauge, limits, transactions, wishlist, and piggy vault.
            - 🧹 **Ultra-Clean, Uncluttered UI**: Redesigned settings modal with minimalist aesthetics.

            ---

            ### 📲 Download APK:
            Download **`PocketBudget-v1.2.0.apk`** below to install the latest version on Android!
          files: release-assets/PocketBudget-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
